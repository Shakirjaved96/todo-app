[project]
name = "todo-cli-py"
version = "0.1.0"
description = "A production-grade in-memory Todo CLI application"
authors = [
    {name = "TODO App Developer", email = "developer@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
]

[project.scripts]
todo = "todo.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]